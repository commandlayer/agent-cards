name: Validate Agent Cards

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate-current-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate current release authority path
        run: npm run validate

  validate-legacy-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate legacy compatibility line
        run: npm run validate:legacy
